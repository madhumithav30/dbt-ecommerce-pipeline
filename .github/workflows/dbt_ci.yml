name: dbt CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dbt-duckdb

      - name: Install dbt Packages
        run: |
          dbt deps

      - name: Seed Raw Data
        run: |
          dbt seed

      - name: Run Snapshot (SCD Type 2)
        run: |
          dbt snapshot

      - name: Build Models & Execute Data Quality Tests
        run: |
          dbt build